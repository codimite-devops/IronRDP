name: stage-release

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to promote, comma separated, or 'all'. Each is promoted at the build QA runs (from the release manifest)"
        required: false
        default: "all"
      auto_merge:
        description: "Auto-merge the deployment PR"
        required: false
        default: false
        type: boolean

jobs:
  stage-release:
    permissions:
      contents: write
      id-token: write
      # Required by the SLSA provenance generator.
      actions: read
      packages: write
    uses: codimite-devops/codimite-gen-actions-core/.github/workflows/workflow_call_stage_release.yaml@main
    with:
      services: ${{ inputs.services }}
      config_file: ".github/configs.yaml"
      environment: "stage"
      update_helmfile: true
      auto_merge: ${{ inputs.auto_merge }}
    secrets:
      CODIMITE_GKE_APP_INSTALLATION_ID: ${{ secrets.CODIMITE_GKE_APP_INSTALLATION_ID }}
      CODIMITE_GKE_BOT_APP_ID: ${{ secrets.CODIMITE_GKE_BOT_APP_ID }}
      CODIMITE_GKE_BOT_PRIVATE_KEY: ${{ secrets.CODIMITE_GKE_BOT_PRIVATE_KEY }}